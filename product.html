<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product - Diatheke Atelier</title>
  <link rel="stylesheet" href="stijl.css">
</head>

<body>
  <header class="page-banner">
    <h1>Product</h1>
  </header>

  <main class="container">
    <a href="producten.html" class="back-link">← Back to products</a>

    <div id="product-detail" aria-live="polite">
      <p>Loading product...</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Diatheke Atelier — Made with care.</p>
  </footer>

  <script src="site-ui.js"></script>
  <script src="taal.js"></script>
  <script src="winkelmand.js"></script>

  <script>
    const slug = new URLSearchParams(location.search).get('product');

    let product = null;
    let productFailed = false;
    let stockState = 'loading';
    let availableStock = null;
    let currentPhoto = 0;
    let galleryObserver = null;

    function renderStock() {
      const message = document.getElementById('stock-message');
      const button = document.getElementById('add-to-cart');
      if (!message || !button) return;

      message.className = 'stock-message';
      button.disabled = true;
      button.textContent = window.siteLanguage.text('add');

      if (stockState === 'loading') {
        message.classList.add('stock-neutral');
        message.textContent = Shop.text(
          'Voorraad wordt opgehaald...', 'Checking stock...'
        );
        return;
      }

      if (stockState === 'missing') {
        message.classList.add('stock-neutral');
        message.textContent = Shop.text(
          'Voor dit product moet de voorraad nog worden ingesteld.',
          'Stock has not yet been configured for this product.'
        );
        return;
      }

      if (stockState === 'error') {
        message.classList.add('stock-neutral');
        message.textContent = Shop.text(
          'De voorraad is tijdelijk niet beschikbaar. Ververs de pagina om het opnieuw te proberen.',
          'Stock information is temporarily unavailable. Refresh the page to try again.'
        );
        return;
      }

      if (availableStock === 0) {
        message.classList.add('sold-out');
        message.textContent = Shop.text(
          'Dit product is momenteel uitverkocht.',
          'This product is currently sold out.'
        );
        button.textContent = Shop.text('Uitverkocht', 'Sold out');
        return;
      }

      button.disabled = false;

      message.textContent = availableStock === 1
        ? Shop.text(
            'Let op: er is nog maar 1 van dit product over!',
            'Please note: only 1 left in stock!'
          )
        : Shop.text(
            `Let op: er zijn nog ${availableStock} van dit product over!`,
            `Please note: only ${availableStock} left in stock!`
          );
    }

    function productPhotos() {
      const extra = Array.isArray(product.extra_images)
        ? product.extra_images : [];

      return [...new Set(
        [product.image, ...extra].map(Shop.imageUrl).filter(Boolean)
      )];
    }

    function createGallery(photos) {
      const gallery = Shop.element('section', 'product-gallery');
      gallery.setAttribute(
        'aria-label', Shop.text('Productfoto’s', 'Product photos')
      );
      gallery.setAttribute(
        'aria-roledescription',
        Shop.text('Fotocarrousel', 'Photo carousel')
      );

      const frame = Shop.element('div', 'gallery-frame');
      const viewport = Shop.element('div', 'gallery-viewport');
      viewport.id = 'product-photo-viewport';
      viewport.setAttribute('aria-label', Shop.text(
        'Veeg om de volgende foto te bekijken',
        'Swipe to view the next photo'
      ));

      if (photos.length > 1) viewport.tabIndex = 0;

      const slides = [];

      photos.forEach((url, index) => {
        const slide = Shop.element('div', 'gallery-slide');
        slide.setAttribute('role', 'group');
        slide.setAttribute('aria-label', Shop.text(
          `Foto ${index + 1} van ${photos.length}`,
          `Photo ${index + 1} of ${photos.length}`
        ));

        const image = Shop.element('img', 'product-photo');
        image.src = url;
        image.alt = `${Shop.title(product)} — ${
          Shop.text('foto', 'photo')
        } ${index + 1}`;
        image.draggable = false;
        image.loading = index === 0 ? 'eager' : 'lazy';

        const fallback = Shop.element('p', 'gallery-error', Shop.text(
          'Deze foto kon niet worden geladen.',
          'This photo could not be loaded.'
        ));
        fallback.hidden = true;

        image.addEventListener('error', () => {
          image.hidden = true;
          fallback.hidden = false;
        });

        slide.append(image, fallback);
        slides.push(slide);
        viewport.append(slide);
      });

      frame.append(viewport);
      gallery.append(frame);
      currentPhoto = Math.max(0, Math.min(currentPhoto, photos.length - 1));

      if (photos.length === 1) return gallery;

      const previous = Shop.element(
        'button', 'gallery-arrow gallery-previous', '‹'
      );
      const next = Shop.element(
        'button', 'gallery-arrow gallery-next', '›'
      );

      previous.type = next.type = 'button';
      previous.setAttribute(
        'aria-label', Shop.text('Vorige foto', 'Previous photo')
      );
      next.setAttribute(
        'aria-label', Shop.text('Volgende foto', 'Next photo')
      );
      previous.setAttribute('aria-controls', viewport.id);
      next.setAttribute('aria-controls', viewport.id);
      frame.append(previous, next);

      const dots = Shop.element('div', 'gallery-dots');
      dots.setAttribute('role', 'group');
      dots.setAttribute(
        'aria-label', Shop.text('Kies een foto', 'Choose a photo')
      );

      const buttons = [];

      photos.forEach((url, index) => {
        const dot = Shop.element('button', 'gallery-dot');
        dot.type = 'button';
        dot.setAttribute('aria-label', Shop.text(
          `Bekijk foto ${index + 1} van ${photos.length}`,
          `View photo ${index + 1} of ${photos.length}`
        ));
        dot.setAttribute('aria-controls', viewport.id);
        dot.addEventListener('click', () => goTo(index));
        buttons.push(dot);
        dots.append(dot);
      });

      const counter = Shop.element('p', 'gallery-counter');
      counter.setAttribute('aria-live', 'polite');
      counter.setAttribute('aria-atomic', 'true');
      gallery.append(dots, counter);

      function update(index) {
        currentPhoto = Math.max(0, Math.min(index, photos.length - 1));

        buttons.forEach((button, i) => {
          button.classList.toggle('active', i === currentPhoto);
          if (i === currentPhoto) {
            button.setAttribute('aria-current', 'true');
          } else {
            button.removeAttribute('aria-current');
          }
        });

        slides.forEach((slide, i) => {
          slide.setAttribute('aria-hidden', String(i !== currentPhoto));
        });

        previous.disabled = currentPhoto === 0;
        next.disabled = currentPhoto === photos.length - 1;
        counter.textContent = Shop.text(
          `Foto ${currentPhoto + 1} van ${photos.length}`,
          `Photo ${currentPhoto + 1} of ${photos.length}`
        );
      }

      function goTo(index) {
        const target = Math.max(0, Math.min(index, photos.length - 1));
        viewport.scrollTo({
          left: target * viewport.clientWidth,
          behavior: 'auto'
        });
        update(target);
      }

      previous.addEventListener('click', () => goTo(currentPhoto - 1));
      next.addEventListener('click', () => goTo(currentPhoto + 1));

      viewport.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          goTo(currentPhoto + (event.key === 'ArrowLeft' ? -1 : 1));
        }
      });

      let scrollFrame = null;

      viewport.addEventListener('scroll', () => {
        if (scrollFrame !== null) return;

        scrollFrame = requestAnimationFrame(() => {
          scrollFrame = null;
          if (viewport.isConnected && viewport.clientWidth) {
            update(Math.round(viewport.scrollLeft / viewport.clientWidth));
          }
        });
      }, { passive: true });

      update(currentPhoto);

      requestAnimationFrame(() => {
        if (viewport.isConnected) {
          viewport.scrollLeft = currentPhoto * viewport.clientWidth;
        }
      });

      if ('ResizeObserver' in window) {
        galleryObserver = new ResizeObserver(() => {
          if (viewport.isConnected) {
            viewport.scrollLeft = currentPhoto * viewport.clientWidth;
          }
        });
        galleryObserver.observe(viewport);
      }

      return gallery;
    }

    function renderProduct() {
      galleryObserver?.disconnect();
      galleryObserver = null;

      const container = document.getElementById('product-detail');
      container.replaceChildren();

      if (!product) {
        container.textContent = productFailed
          ? window.siteLanguage.text('notFound')
          : Shop.text('Product wordt geladen...', 'Loading product...');
        return;
      }

      const layout = Shop.element('div', 'product-layout');
      const photos = productPhotos();
      if (photos.length) layout.append(createGallery(photos));

      const info = Shop.element('div', 'product-info');
      const heading = Shop.element('h2', '', Shop.title(product));
      const price = Shop.element(
        'p', 'product-price', Shop.money(product.cents)
      );
      const description = Shop.element(
        'p', 'product-description', Shop.description(product, true)
      );

      const stock = Shop.element('p', 'stock-message');
      stock.id = 'stock-message';
      stock.setAttribute('role', 'status');

      const button = Shop.element(
        'button', 'shop-button', window.siteLanguage.text('add')
      );
      button.id = 'add-to-cart';
      button.type = 'button';
      button.disabled = true;

      button.addEventListener('click', async () => {
        await Shop.add(product, button);
        await loadStock();
      });

      info.append(heading, price, description, stock, button);
      layout.append(info);
      container.append(layout);

      document.title = `${Shop.title(product)} - Diatheke Atelier`;
      renderStock();
    }

    async function loadStock() {
      stockState = 'loading';
      renderStock();

      try {
        availableStock = await Shop.getStock(slug);
        stockState = 'ready';
      } catch (error) {
        availableStock = null;
        stockState = error.status === 404 ? 'missing' : 'error';
      } finally {
        renderStock();
      }
    }

    async function loadProduct() {
      if (!slug || !/^[a-zA-Z0-9_-]+$/.test(slug)) {
        productFailed = true;
        renderProduct();
        return;
      }

      try {
        product = await Shop.getProduct(slug);
        renderProduct();
        await loadStock();
      } catch (_) {
        productFailed = true;
        renderProduct();
      }
    }

    window.addEventListener('site-language-change', renderProduct);
    loadProduct();
  </script>
</body>
</html>
