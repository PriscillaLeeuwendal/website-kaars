<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product - Licht & Liefde</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

  <style>
    @font-face {
      font-family: Marseille;
      src: url('fonts/Marseille.ttf') format('truetype');
    }

    body {
      margin: 0;
      background: #fcfbfa;
      color: #4a4543;
      font-family: Georgia, serif;
      line-height: 1.6;
    }

    header {
      position: relative;
      padding: 80px 20px 40px;
      color: white;
      text-align: center;
      background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
        url('images/hero-banner.jpg') center/cover;
      border-bottom: 1px solid #e8e1da;
    }

    .cart-link {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 14px;
      border-radius: 4px;
      background: #8c7b70;
      color: white;
      text-decoration: none;
      font: .85em sans-serif;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }

    .cart-link:hover,
    .shop-button:hover {
      background: #736359;
    }

    header h1 {
      margin-bottom: 10px;
      font: 3em Marseille, Georgia, serif;
    }

    .main-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    .main-nav a {
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 20px;
      background: rgba(255,255,255,.2);
      color: white;
      text-decoration: none;
      font: .9em sans-serif;
      backdrop-filter: blur(5px);
    }

    .main-nav a:hover,
    .main-nav a.active {
      background: rgba(255,255,255,.4);
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      min-height: 250px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #736359;
    }

    .product-layout {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 45px;
      align-items: start;
    }

    .product-photo {
      width: 100%;
      max-height: 580px;
      object-fit: contain;
      background: white;
      border: 1px solid #e8e1da;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .product-info h2 {
      margin: 0 0 10px;
      color: #3b3533;
      font: 2.5em Marseille, Georgia, serif;
    }

    .product-price {
      margin: 0 0 22px;
      font-size: 1.4em;
      font-weight: bold;
    }

    .product-description {
      margin-bottom: 28px;
      white-space: pre-line;
    }

    .stock-message {
      padding: 12px 16px;
      margin: 0 0 20px;
      border: 1px solid #e8e1da;
      border-radius: 6px;
      background: #f4efe9;
      font-size: .95em;
    }

    .stock-message.sold-out {
      border-color: #e7c7bf;
      background: #faeeeb;
      color: #8b4437;
    }

    .stock-message.stock-neutral { color: #7a706b; }

    .shop-button {
      padding: 12px 22px;
      border: 0;
      border-radius: 4px;
      background: #8c7b70;
      color: white;
      cursor: pointer;
      font: .95em sans-serif;
    }

    .shop-button:disabled {
      background: #b6aaa2;
      cursor: not-allowed;
    }

    footer {
      margin-top: 50px;
      padding: 30px;
      border-top: 1px solid #e8e1da;
      background: #f4efe9;
      color: #7a706b;
      text-align: center;
      font-size: .9em;
    }

    @media(max-width: 700px) {
      .product-layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .product-info h2 { font-size: 2em; }
    }
  </style>
</head>

<body>
  <header>
    <a href="#winkelmand" class="cart-link" data-open-cart>
      Winkelmand (<span data-cart-count>0</span>)
    </a>

    <h1>Product</h1>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="producten.html" class="active">Producten</a>
      <a href="over-ons.html">Over ons</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <a href="producten.html" class="back-link">
      ← Terug naar producten
    </a>

    <div id="product-detail" aria-live="polite">
      <p>Product wordt geladen...</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Licht & Liefde - Handgemaakt met zorg.</p>
  </footer>

  <script src="taal.js"></script>
  <script src="winkelmand.js"></script>

  <script>
    const slug = new URLSearchParams(location.search).get('product');

    let product = null;
    let productFailed = false;
    let stockState = 'loading';
    let availableStock = null;

    function renderStock() {
      const message = document.getElementById('stock-message');
      const button = document.getElementById('add-to-cart');

      if (!message || !button) return;

      message.className = 'stock-message';
      button.disabled = true;
      button.textContent = window.siteLanguage.text('add');

      if (stockState === 'loading') {
        message.classList.add('stock-neutral');
        message.textContent = Shop.text(
          'Voorraad wordt opgehaald...',
          'Checking stock...'
        );
        return;
      }

      if (stockState === 'missing') {
        message.classList.add('stock-neutral');
        message.textContent = Shop.text(
          'Voor dit product moet de voorraad nog worden ingesteld.',
          'Stock has not yet been configured for this product.'
        );
        return;
      }

      if (stockState === 'error') {
        message.classList.add('stock-neutral');
        message.textContent = Shop.text(
          'De voorraad is tijdelijk niet beschikbaar. Ververs de pagina om het opnieuw te proberen.',
          'Stock information is temporarily unavailable. Refresh the page to try again.'
        );
        return;
      }

      if (availableStock === 0) {
        message.classList.add('sold-out');
        message.textContent = Shop.text(
          'Dit product is momenteel uitverkocht.',
          'This product is currently sold out.'
        );

        button.textContent = Shop.text('Uitverkocht', 'Sold out');
        return;
      }

      button.disabled = false;

      message.textContent = availableStock === 1
        ? Shop.text(
            'Let op: er is nog maar 1 van dit product over!',
            'Please note: only 1 left in stock!'
          )
        : Shop.text(
            `Let op: er zijn nog ${availableStock} van dit product over!`,
            `Please note: only ${availableStock} left in stock!`
          );
    }

    function renderProduct() {
      const container = document.getElementById('product-detail');
      container.replaceChildren();

      if (!product) {
        container.textContent = productFailed
          ? window.siteLanguage.text('notFound')
          : Shop.text(
              'Product wordt geladen...',
              'Loading product...'
            );
        return;
      }

      const layout = Shop.element('div', 'product-layout');
      const imageUrl = Shop.imageUrl(product.image);

      if (imageUrl) {
        const image = Shop.element('img', 'product-photo');
        image.src = imageUrl;
        image.alt = Shop.title(product);
        layout.append(image);
      }

      const info = Shop.element('div', 'product-info');

      const heading = Shop.element('h2', '', Shop.title(product));

      const price = Shop.element(
        'p',
        'product-price',
        Shop.money(product.cents)
      );

      const description = Shop.element(
        'p',
        'product-description',
        Shop.description(product, true)
      );

      const stock = Shop.element('p', 'stock-message');
      stock.id = 'stock-message';
      stock.setAttribute('role', 'status');

      const button = Shop.element(
        'button',
        'shop-button',
        window.siteLanguage.text('add')
      );

      button.id = 'add-to-cart';
      button.type = 'button';
      button.disabled = true;

      button.addEventListener('click', async () => {
        await Shop.add(product, button);
        await loadStock();
      });

      info.append(heading, price, description, stock, button);
      layout.append(info);
      container.append(layout);

      document.title = `${Shop.title(product)} - Licht & Liefde`;
      renderStock();
    }

    async function loadStock() {
      stockState = 'loading';
      renderStock();

      try {
        availableStock = await Shop.getStock(slug);
        stockState = 'ready';
      } catch (error) {
        availableStock = null;
        stockState = error.status === 404 ? 'missing' : 'error';
      } finally {
        renderStock();
      }
    }

    async function loadProduct() {
      if (!slug || !/^[a-zA-Z0-9_-]+$/.test(slug)) {
        productFailed = true;
        renderProduct();
        return;
      }

      try {
        product = await Shop.getProduct(slug);
        renderProduct();
        await loadStock();
      } catch (error) {
        productFailed = true;
        renderProduct();
      }
    }

    window.addEventListener('site-language-change', renderProduct);

    loadProduct();
  </script>
</body>
</html>
