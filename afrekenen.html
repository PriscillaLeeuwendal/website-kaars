<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Checkout - Diatheke Atelier</title>
  <link rel="stylesheet" href="stijl.css">

  <style>
    [hidden] {
      display: none !important;
    }

    .account-note {
      margin: 0 0 20px;
      padding: 12px 16px;
      border: 1px solid #e8e1da;
      border-radius: 6px;
      background: #f4efe9;
      color: #4a4543;
      font-size: .95rem;
    }

    .account-note a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>

<body>
  <header class="page-banner">
    <h1 id="heading">Checkout</h1>
  </header>

  <main class="container checkout-container">
    <a href="producten.html" id="back">← Back to shop</a>
    <p class="test" id="test-note"></p>

    <section class="box">
      <h2 id="summary-title">Your order</h2>
      <div id="summary" aria-live="polite"></div>
    </section>

    <section class="box">
      <h2 id="address-title">Shipping address</h2>

      <p
        id="account-note"
        class="account-note"
        role="status"
        aria-live="polite"
      ></p>

      <form id="checkout-form">
        <fieldset id="customer-fields" disabled>
          <div class="fields">
            <label>
              <span data-label="first_name"></span>
              <input
                name="first_name"
                autocomplete="given-name"
                maxlength="80"
                required
              >
            </label>

            <label>
              <span data-label="last_name"></span>
              <input
                name="last_name"
                autocomplete="family-name"
                maxlength="100"
                required
              >
            </label>

            <label class="wide">
              <span data-label="email"></span>
              <input
                name="email"
                type="email"
                autocomplete="email"
                maxlength="254"
                required
              >
            </label>

            <label>
              <span data-label="street"></span>
              <input
                name="street"
                autocomplete="address-line1"
                maxlength="150"
                required
              >
            </label>

            <label>
              <span data-label="house_number"></span>
              <input
                name="house_number"
                autocomplete="address-line2"
                maxlength="30"
                required
              >
            </label>

            <label>
              <span data-label="postal_code"></span>
              <input
                name="postal_code"
                autocomplete="postal-code"
                maxlength="12"
                required
              >
            </label>

            <label>
              <span data-label="city"></span>
              <input
                name="city"
                autocomplete="address-level2"
                maxlength="100"
                required
              >
            </label>
          </div>

          <p id="country-note"></p>
        </fieldset>

        <button
          id="pay"
          class="shop-button"
          type="submit"
          disabled
        ></button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>

      <a id="continue" class="shop-button" hidden></a>

      <button
        id="restart"
        class="shop-button"
        type="button"
        hidden
      ></button>
    </section>
  </main>

  <footer>
    <p>© 2026 Diatheke Atelier — Made with care.</p>
  </footer>

  <script src="site-ui.js"></script>
  <script src="taal.js"></script>
  <script src="winkelmand.js"></script>
  <script src="account.js"></script>

  <script>
    const ATTEMPT_KEY = 'licht-en-liefde-checkout-v1';

    const form = document.getElementById('checkout-form');
    const fields = document.getElementById('customer-fields');
    const pay = document.getElementById('pay');
    const message = document.getElementById('message');
    const continueLink = document.getElementById('continue');
    const restart = document.getElementById('restart');
    const accountNote = document.getElementById('account-note');

    const addressNames = [
      'first_name',
      'last_name',
      'street',
      'house_number',
      'postal_code',
      'city'
    ];

    const editedFields = new Set();

    let attempt = null;
    let items = [];
    let products = [];
    let expectedTotal = 0;
    let shipping = null;
    let ready = false;
    let busy = false;
    let terminal = false;
    let storageError = false;
    let accountState = 'loading';

    form.addEventListener('input', event => {
      if (event.target.name) {
        editedFields.add(event.target.name);
      }
    });

    try {
      attempt = JSON.parse(
        sessionStorage.getItem(ATTEMPT_KEY) || 'null'
      );
    } catch (_) {
      storageError = true;
    }

    if (attempt && (
      !Array.isArray(attempt.items) ||
      !attempt.customer ||
      !/^[a-f0-9]{64}$/.test(attempt.checkout_key || '')
    )) {
      storageError = true;
      attempt = null;
    }

    function renderAccountNote() {
      accountNote.replaceChildren();

      if (accountState === 'loading') {
        accountNote.textContent = Shop.text(
          'Je accountgegevens worden gecontroleerd...',
          'Checking your account details...'
        );
        return;
      }

      if (accountState === 'resuming') {
        accountNote.textContent = Shop.text(
          'Voor deze al gestarte bestelling gebruiken we de eerder ingevulde gegevens.',
          'This existing order uses the details entered when it was started.'
        );
        return;
      }

      if (accountState === 'filled') {
        accountNote.textContent = Shop.text(
          'Je opgeslagen accountgegevens zijn ingevuld. Controleer je afleveradres. Je kunt het voor deze bestelling aanpassen; je opgeslagen adres blijft hetzelfde.',
          'Your saved account details have been filled in. Check your shipping address. You can change it for this order; your saved address stays the same.'
        );
        return;
      }

      if (accountState === 'no-address') {
        accountNote.textContent = Shop.text(
          'Je bent ingelogd. Je e-mailadres is ingevuld, maar er is nog geen afleveradres opgeslagen in je account.',
          'You are signed in. Your email address has been filled in, but your account does not have a saved shipping address yet.'
        );
        return;
      }

      if (accountState === 'error') {
        accountNote.textContent = Shop.text(
          'Je accountgegevens konden niet worden opgehaald. Je kunt je gegevens hieronder zelf invullen en gewoon verdergaan.',
          'Your account details could not be loaded. You can enter your details below and continue.'
        );
        return;
      }

      accountNote.append(document.createTextNode(
        accountState === 'expired'
          ? Shop.text(
              'Je inlogsessie is verlopen. Bestel zonder account of ',
              'Your sign-in session has expired. Continue as a guest or '
            )
          : Shop.text(
              'Je kunt bestellen zonder account. Heb je al een account? ',
              'You can order as a guest. Already have an account? '
            )
      ));

      const link = document.createElement('a');
      link.href = 'account.html';
      link.textContent = Shop.text('Log in', 'Sign in');

      accountNote.append(link, document.createTextNode(
        Shop.text(
          ' en ga daarna opnieuw naar afrekenen.',
          ' and then return to checkout.'
        )
      ));
    }

    function translate() {
      document.title = Shop.text(
        'Afrekenen - Diatheke Atelier',
        'Checkout - Diatheke Atelier'
      );

      document.getElementById('heading').textContent =
        Shop.text('Afrekenen', 'Checkout');

      document.getElementById('back').textContent =
        Shop.text('← Terug naar shop', '← Back to shop');

      document.getElementById('test-note').textContent = Shop.text(
        shipping?.mode === 'test'
          ? 'Testmodus: er wordt geen echt geld afgeschreven. Verzending is alleen binnen Nederland.'
          : 'Verzending is alleen binnen Nederland.',
        shipping?.mode === 'test'
          ? 'Test mode: no real money is charged. Shipping is available only within the Netherlands.'
          : 'Shipping is available only within the Netherlands.'
      );

      document.getElementById('summary-title').textContent =
        Shop.text('Je bestelling', 'Your order');

      document.getElementById('address-title').textContent =
        Shop.text('Afleveradres', 'Shipping address');

      document.getElementById('country-note').textContent =
        Shop.text('Land: Nederland', 'Country: Netherlands');

      const labels = {
        first_name: ['Voornaam', 'First name'],
        last_name: ['Achternaam', 'Last name'],
        email: ['E-mailadres', 'Email address'],
        street: ['Straat', 'Street'],
        house_number: ['Huisnummer en toevoeging', 'House number'],
        postal_code: ['Postcode', 'Postal code'],
        city: ['Plaats', 'City']
      };

      document.querySelectorAll('[data-label]').forEach(node => {
        node.textContent = Shop.text(...labels[node.dataset.label]);
      });

      pay.textContent = busy
        ? Shop.text('Betaling wordt voorbereid...', 'Preparing payment...')
        : attempt
          ? Shop.text('Hervat deze bestelling', 'Resume this order')
          : Shop.text(
              shipping?.mode === 'test'
                ? 'Naar Mollie — testbetaling'
                : 'Naar Mollie — betalen',
              shipping?.mode === 'test'
                ? 'Continue to Mollie — test payment'
                : 'Continue to Mollie — pay'
            );

      continueLink.textContent =
        Shop.text('Doorgaan naar Mollie', 'Continue to Mollie');

      restart.textContent =
        Shop.text('Begin een nieuwe bestelling', 'Start a new order');

      renderAccountNote();

      if (ready) {
        renderSummary();
      }
    }

    function renderSummary() {
      const summary = document.getElementById('summary');
      summary.replaceChildren();

      let subtotal = 0;

      products.forEach((product, index) => {
        const quantity = items[index].quantity;
        const row = Shop.element('div', 'line');

        row.append(
          Shop.element(
            'span',
            '',
            `${quantity} × ${Shop.title(product)}`
          ),
          Shop.element(
            'span',
            '',
            Shop.money(product.cents * quantity)
          )
        );

        summary.append(row);
        subtotal += product.cents * quantity;
      });

      expectedTotal = subtotal + shipping.shipping_cents;

      summary.append(
        Shop.element(
          'p',
          '',
          `${Shop.text('Verzending', 'Shipping')}: ${Shop.money(shipping.shipping_cents)}`
        ),
        Shop.element(
          'strong',
          '',
          `${Shop.text('Totaal', 'Total')}: ${Shop.money(expectedTotal)}`
        )
      );
    }

    function saveAttempt() {
      sessionStorage.setItem(
        ATTEMPT_KEY,
        JSON.stringify(attempt)
      );
    }

    function paymentPage(orderId) {
      return 'betaling.html?order=' +
        encodeURIComponent(orderId) +
        '&key=' + attempt.checkout_key;
    }

    function fillAccountField(name, value) {
      const input = form.elements.namedItem(name);

      if (
        !input ||
        typeof value !== 'string' ||
        editedFields.has(name) ||
        input.value.trim()
      ) {
        return;
      }

      input.value = value;
    }

    async function loadAccountDetails() {
      if (attempt) {
        accountState = 'resuming';
        renderAccountNote();
        return;
      }

      try {
        if (!window.CustomerAccount) {
          throw new Error('Account code unavailable');
        }

        const account = await CustomerAccount.getAccount();

        if (!account) {
          accountState = 'guest';
          return;
        }

        fillAccountField('email', account.email);

        const address = account.address;

        if (
          !address ||
          typeof address !== 'object' ||
          Array.isArray(address) ||
          (address.country && address.country !== 'NL')
        ) {
          accountState = 'no-address';
          return;
        }

        for (const name of addressNames) {
          fillAccountField(name, address[name]);
        }

        accountState = 'filled';
      } catch (error) {
        accountState = error.status === 401
          ? 'expired'
          : 'error';
      } finally {
        renderAccountNote();
      }
    }

    async function load() {
      translate();

      if (storageError) {
        accountState = 'error';
        renderAccountNote();

        message.textContent = Shop.text(
          'Je browser kan de bestelgegevens niet veilig bewaren. Sta websiteopslag toe voordat je afrekent.',
          'Allow website storage before checking out.'
        );
        return;
      }

      items = attempt ? attempt.items : Shop.snapshot();

      if (!items.length) {
        accountNote.hidden = true;

        document.getElementById('summary').textContent =
          Shop.text('Je winkelmand is leeg.', 'Your cart is empty.');
        return;
      }

      if (attempt) {
        for (const [name, value] of Object.entries(attempt.customer)) {
          const input = form.elements.namedItem(name);

          if (input && typeof value === 'string') {
            input.value = value;
          }
        }

        message.textContent = Shop.text(
          'Er is al een bestelling gestart. Hervat die met dezelfde gegevens om een dubbele bestelling te voorkomen.',
          'An order has already been started. Resume it with the same details to avoid a duplicate order.'
        );
      }

      try {
        const [loadedProducts, loadedShipping] = await Promise.all([
          Promise.all(
            items.map(item =>
              Shop.getProduct(item.product_id, true)
            )
          ),
          Shop.getShipping(),
          loadAccountDetails()
        ]);

        products = loadedProducts;
        shipping = loadedShipping;
        ready = true;

        translate();

        fields.disabled = Boolean(attempt);
        pay.disabled = false;
      } catch (_) {
        document.getElementById('summary').textContent = Shop.text(
          'De producten of verzendkosten konden niet worden geladen. Ververs deze pagina om het opnieuw te proberen.',
          'Products or shipping costs could not be loaded. Refresh this page to try again.'
        );
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (!ready || busy || terminal) {
        return;
      }

      if (!attempt && !form.reportValidity()) {
        return;
      }

      busy = true;
      pay.disabled = true;
      continueLink.hidden = true;
      message.textContent = '';

      translate();

      try {
        if (!attempt) {
          if (
            JSON.stringify(Shop.snapshot()) !== JSON.stringify(items)
          ) {
            throw new Error(Shop.text(
              'Je winkelmand is veranderd. Ververs deze pagina voordat je afrekent.',
              'Your cart has changed. Refresh this page before checking out.'
            ));
          }

          const customer = { country: 'NL' };

          const names = [
            'first_name',
            'last_name',
            'email',
            'street',
            'house_number',
            'postal_code',
            'city'
          ];

          for (const name of names) {
            customer[name] =
              form.elements.namedItem(name).value.trim();
          }

          const random = crypto.getRandomValues(
            new Uint8Array(32)
          );

          attempt = {
            checkout_key: [...random]
              .map(byte =>
                byte.toString(16).padStart(2, '0')
              )
              .join(''),
            items,
            customer,
            language: window.siteLanguage.get()
          };
        }

        saveAttempt();
        fields.disabled = true;

        const response = await fetch(Shop.API + '/checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(attempt),
          signal: AbortSignal.timeout(45000)
        });

        const data = await response.json();

        if (!response.ok) {
          if (
            response.status === 409 &&
            data.error ===
              'Er is onvoldoende voorraad. Pas je winkelmand aan.'
          ) {
            sessionStorage.removeItem(ATTEMPT_KEY);
            attempt = null;
            fields.disabled = false;

            throw new Error(Shop.text(
              data.error,
              'There is insufficient stock. Update your cart.'
            ));
          }

          throw new Error(Shop.text(
            data.error || 'Afrekenen is mislukt.',
            'The payment could not be started. Retry the same order.'
          ));
        }

        if (
          !['test', 'live'].includes(data.mode) ||
          !data.order_id
        ) {
          throw new Error(Shop.text(
            'Onverwacht antwoord. Probeer dezelfde bestelling opnieuw.',
            'Unexpected response. Retry the same order.'
          ));
        }

        attempt.order_id = data.order_id;
        attempt.mode = data.mode;
        saveAttempt();

        if (data.status === 'paid') {
          location.href = paymentPage(data.order_id);
          return;
        }

        if (
          ['canceled', 'expired', 'failed'].includes(data.status)
        ) {
          terminal = true;
          restart.hidden = false;

          message.textContent = Shop.text(
            'Deze betaling is beëindigd zonder geslaagde betaling. Je kunt een nieuwe bestelling starten.',
            'This payment ended without success. You can start a new order.'
          );
          return;
        }

        if (
          data.status !== 'pending' ||
          !data.checkout_url
        ) {
          throw new Error(Shop.text(
            'De bestelling wordt nog gecontroleerd. Hervat dezelfde bestelling.',
            'The order is still being checked. Resume the same order.'
          ));
        }

        const url = new URL(data.checkout_url);

        if (
          url.protocol !== 'https:' ||
          !(
            url.hostname === 'mollie.com' ||
            url.hostname.endsWith('.mollie.com')
          )
        ) {
          throw new Error(Shop.text(
            'Ongeldige betaallink.',
            'Invalid payment link.'
          ));
        }

        if (
          data.total_cents !== expectedTotal ||
          data.mode !== shipping.mode
        ) {
          continueLink.href = url.href;
          continueLink.hidden = false;

          message.textContent = Shop.text(
            `${data.mode === 'live' ? 'Dit is een echte betaling.' : 'Dit is een testbetaling.'} Het bevestigde totaal inclusief verzending is ${Shop.money(data.total_cents)}. Controleer dit voordat je doorgaat.`,
            `${data.mode === 'live' ? 'This is a real payment.' : 'This is a test payment.'} The confirmed total including shipping is ${Shop.money(data.total_cents)}. Check this before continuing.`
          );
        } else {
          location.href = url.href;
        }
      } catch (error) {
        message.textContent =
          error.name === 'TimeoutError' ||
          error.name === 'AbortError'
            ? Shop.text(
                'De verbinding duurde te lang. Hervat dezelfde bestelling; je gegevens zijn bewaard.',
                'The connection timed out. Resume the same order; your details have been kept.'
              )
            : error.message;
      } finally {
        busy = false;
        pay.disabled = terminal;

        translate();
      }
    });

    restart.addEventListener('click', () => {
      try {
        sessionStorage.removeItem(ATTEMPT_KEY);
        location.reload();
      } catch (_) {
        message.textContent = Shop.text(
          'Bestelgegevens konden niet worden gewist.',
          'Could not clear order details.'
        );
      }
    });

    window.addEventListener(
      'site-language-change',
      translate
    );

    load();
  </script>
</body>
</html>
