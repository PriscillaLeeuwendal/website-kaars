backend:
  name: github
  repo: timdekruyf07-dotcom/website-kaars
  branch: main
  client_id: Ov23ctS2qzGMaPsJh1BA

media_folder: "images"
public_folder: "/images"

collections:
  - name: "producten"
    label: "Producten"
    folder: "content/producten"
    create: true
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Titel Engels", name: "title_en", widget: "string", required: false}
      - {label: "Prijs", name: "price", widget: "number"}
      - {label: "Beschrijving", name: "description", widget: "text"}
      - {label: "Beschrijving Engels", name: "description_en", widget: "text", required: false}
      - {label: "Afbeelding", name: "image", widget: "image"}
