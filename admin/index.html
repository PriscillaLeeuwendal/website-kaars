<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beheerscherm</title>

  <style>
    #website-beheer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10000;
      box-sizing: border-box;
      width: min(360px, calc(100vw - 40px));
      padding: 18px;
      border: 1px solid #d7c5ae;
      border-radius: 8px;
      background: #faf7f2;
      color: #3d3024;
      box-shadow: 0 3px 12px #0003;
      font: 14px/1.5 Arial, sans-serif;
      max-height: calc(100dvh - 40px);
      overflow: auto;
    }

    #website-beheer summary {
      cursor: pointer;
      font-weight: bold;
    }

    #website-beheer label {
      display: block;
      margin-top: 12px;
    }

    #website-beheer input {
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0;
      padding: 10px;
      border: 1px solid #c7b8a6;
      border-radius: 4px;
      font: inherit;
    }

    #website-beheer button,
    #website-beheer a {
      display: inline-block;
      padding: 10px 12px;
      margin: 4px 0;
      border: 0;
      border-radius: 4px;
      background: #736359;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    #website-beheer button:hover,
    #website-beheer a:hover {
      background: #594c44;
    }

    #website-beheer button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #website-beheer button:focus-visible {
      outline: 2px solid #3d3024;
      outline-offset: 3px;
    }

    #website-open {
      background: #45694b !important;
    }

    #website-close {
      background: #8b4437 !important;
    }

    #website-status {
      font-weight: bold;
    }

    #website-result {
      overflow-wrap: anywhere;
    }

    #website-beheer hr {
      border: 0;
      border-top: 1px solid #d7c5ae;
      margin: 18px 0;
    }
  </style>
</head>

<body>
  <details id="website-beheer">
    <summary>Website, verzending en voorraad beheren</summary>

    <p id="website-status" role="status">
      Status wordt opgehaald…
    </p>

    <form id="website-login">
      <label for="website-password">
        Voorraadbeheerwachtwoord
      </label>

      <input
        id="website-password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="website-unlock" type="submit">
        Bediening ontgrendelen
      </button>
    </form>

    <button id="website-open" type="button" disabled>
      Website openen
    </button>

    <button id="website-close" type="button" disabled>
      Website sluiten
    </button>

    <hr>

    <form id="shipping-form">
      <label for="shipping-price">
        Verzendkosten binnen Nederland (€)
      </label>

      <input
        id="shipping-price"
        type="text"
        inputmode="decimal"
        placeholder="7,95"
        disabled
        required
      >

      <button id="shipping-save" type="submit" disabled>
        Verzendkosten opslaan
      </button>
    </form>

    <p>
      Wijzigingen gelden voor nieuwe bestellingen.
      Bestaande bestellingen houden hun oorspronkelijke
      verzendkosten.
    </p>

    <p id="website-result" role="status" aria-live="polite"></p>

    <button id="website-refresh" type="button">
      Instellingen opnieuw ophalen
    </button>

    <p>
      <a href="voorraad.html">Voorraad beheren</a>
    </p>
  </details>

  <script>
    (() => {
      const API =
        'https://licht-en-liefde-api.timdekruyf07.workers.dev';

      const get = id => document.getElementById(id);

      let token = '';
      let state = null;
      let shipping = null;
      let busy = false;

      function render() {
        get('website-status').textContent = state
          ? (
              state.is_open
                ? 'Website is OPEN'
                : 'Website is GESLOTEN'
            )
          : 'Website-status is nog niet beschikbaar';

        get('website-open').disabled =
          busy || !token || !state || state.is_open;

        get('website-close').disabled =
          busy || !token || !state || !state.is_open;

        get('website-unlock').disabled = busy;
        get('website-refresh').disabled = busy;

        get('shipping-price').disabled =
          busy || !token || !shipping;

        get('shipping-save').disabled =
          busy || !token || !shipping;
      }

      async function request(path, body) {
        const response = await fetch(API + path, {
          method: body === undefined ? 'GET' : 'PUT',
          headers: {
            ...(token ? {
              Authorization: 'Bearer ' + token
            } : {}),
            ...(body === undefined ? {} : {
              'Content-Type': 'application/json'
            })
          },
          body: body === undefined
            ? undefined
            : JSON.stringify(body),
          cache: 'no-store',
          credentials: 'omit',
          signal: AbortSignal.timeout(15000)
        });

        const data = await response.json();

        if (!response.ok) {
          const error = new Error(
            data.error || 'De aanvraag is mislukt.'
          );

          error.status = response.status;
          throw error;
        }

        return data;
      }

      function failure(error) {
        if (error.status === 401) token = '';

        get('website-result').textContent =
          error.message +
          ' Haal de instellingen opnieuw op.';
      }

      async function load() {
        if (busy) return;

        busy = true;
        render();

        get('website-result').textContent =
          'Instellingen ophalen…';

        try {
          state = await request(
            token ? '/admin/site-state' : '/site-state'
          );

          if (typeof state.is_open !== 'boolean') {
            throw new Error('Ongeldige website-status.');
          }

          shipping = token
            ? await request('/admin/shipping')
            : null;

          if (shipping) {
            if (
              !Number.isSafeInteger(shipping.shipping_cents) ||
              !Number.isSafeInteger(shipping.version)
            ) {
              throw new Error('Ongeldige verzendkosten.');
            }

            get('shipping-price').value =
              (shipping.shipping_cents / 100)
                .toFixed(2)
                .replace('.', ',');
          }

          get('website-result').textContent = token
            ? 'De bediening is ontgrendeld.'
            : '';
        } catch (error) {
          shipping = null;
          failure(error);
        } finally {
          busy = false;
          render();
        }
      }

      async function changeState(isOpen) {
        if (busy || !token || !state) return;

        busy = true;
        render();

        try {
          state = await request('/admin/site-state', {
            is_open: isOpen,
            version: state.version
          });

          get('website-result').textContent =
            state.is_open
              ? 'De website is geopend.'
              : 'De website is gesloten. Nieuwe bestellingen zijn geblokkeerd.';
        } catch (error) {
          state = null;
          failure(error);
        } finally {
          busy = false;
          render();
        }
      }

      get('shipping-form').addEventListener(
        'submit',
        async event => {
          event.preventDefault();

          if (busy || !token || !shipping) return;

          const value = get('shipping-price').value
            .trim()
            .replace(',', '.');

          if (!/^\d{1,4}(\.\d{1,2})?$/.test(value)) {
            get('website-result').textContent =
              'Vul bijvoorbeeld 7,95 in, met maximaal twee decimalen.';
            return;
          }

          const [whole, fraction = ''] = value.split('.');

          const cents =
            Number(whole) * 100 +
            Number(fraction.padEnd(2, '0'));

          if (cents > 100000) {
            get('website-result').textContent =
              'Gebruik een bedrag tussen 0 en 1000 euro.';
            return;
          }

          busy = true;
          render();

          try {
            shipping = await request('/admin/shipping', {
              shipping_cents: cents,
              version: shipping.version
            });

            get('shipping-price').value =
              (shipping.shipping_cents / 100)
                .toFixed(2)
                .replace('.', ',');

            get('website-result').textContent =
              'Verzendkosten opgeslagen voor nieuwe bestellingen.';
          } catch (error) {
            shipping = null;
            failure(error);
          } finally {
            busy = false;
            render();
          }
        }
      );

      get('website-login').addEventListener(
        'submit',
        event => {
          event.preventDefault();

          if (busy) return;

          token = get('website-password').value;
          get('website-password').value = '';

          load();
        }
      );

      get('website-open').addEventListener(
        'click',
        () => changeState(true)
      );

      get('website-close').addEventListener(
        'click',
        () => changeState(false)
      );

      get('website-refresh').addEventListener(
        'click',
        load
      );

      get('website-beheer').addEventListener(
        'toggle',
        () => {
          if (get('website-beheer').open) {
            load();
          } else {
            token = '';
            shipping = null;
            get('website-password').value = '';
            render();
          }
        }
      );

      load();
    })();
  </script>

  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
