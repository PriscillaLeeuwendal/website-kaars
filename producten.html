<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - Diatheke Atelier</title>
  <link rel="stylesheet" href="stijl.css">
</head>

<body>
  <header class="page-banner">
    <h1>Shop</h1>
  </header>

  <main class="container">
    <section class="section">
      <h2>Handmade Candles</h2>

      <div id="product-list" class="products" aria-live="polite">
        <p data-status="loading">Loading products...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Diatheke Atelier — Made with care.</p>
  </footer>

  <script src="site-ui.js"></script>
  <script src="taal.js"></script>
  <script src="winkelmand.js"></script>

  <script>
    let loadedProducts = [];
    let status = 'loading';
    let loading = false;

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.replaceChildren();

      if (status !== 'ready') {
        const message = Shop.element(
          'p',
          '',
          window.siteLanguage.text(status)
        );

        message.dataset.status = status;
        container.append(message);
        return;
      }

      for (const product of loadedProducts) {
        const card = Shop.element('article', 'product-card');
        const link = Shop.element('a', 'product-detail-link');

        link.href =
          `product.html?product=${encodeURIComponent(product.id)}`;

        const imageUrl = Shop.imageUrl(product.image);

        if (imageUrl) {
          const image = Shop.element('img');

          image.src = imageUrl;
          image.alt = Shop.title(product);
          image.loading = 'lazy';

          link.append(image);
        }

        link.append(
          Shop.element('h3', '', Shop.title(product))
        );

        const description = Shop.element(
          'p',
          '',
          Shop.description(product)
        );

        const price = Shop.element(
          'p',
          'product-price',
          Shop.money(product.cents)
        );

        const button = Shop.element(
          'button',
          'shop-button',
          window.siteLanguage.text('add')
        );

        button.type = 'button';

        button.addEventListener('click', () => {
          Shop.add(product, button);
        });

        card.append(link, description, price, button);
        container.append(card);
      }
    }

    async function loadProducts() {
      if (loading) return;

      loading = true;
      status = 'loading';
      renderProducts();

      try {
        loadedProducts = await Shop.listProducts();
        status = loadedProducts.length ? 'ready' : 'empty';
      } catch (error) {
        status = 'error';
        console.error('Producten laden mislukt:', error);
      } finally {
        loading = false;
        renderProducts();
      }
    }

    window.addEventListener(
      'site-language-change',
      renderProducts
    );

    loadProducts();
  </script>
</body>
</html>
