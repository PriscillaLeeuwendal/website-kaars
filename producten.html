<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producten - Licht & Liefde</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

  <style>
    @font-face {
      font-family: Marseille;
      src: url('fonts/Marseille.ttf') format('truetype');
    }

    body {
      margin: 0;
      background: #fcfbfa;
      color: #4a4543;
      font-family: Georgia, serif;
      line-height: 1.6;
    }

    header {
      position: relative;
      padding: 80px 20px 40px;
      color: white;
      text-align: center;
      background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
        url('images/hero-banner.jpg') center/cover;
      border-bottom: 1px solid #e8e1da;
    }

    header h1 {
      margin-bottom: 10px;
      font: 3em Marseille, Georgia, serif;
    }

    .cart-link,
    .admin-link,
    .refresh-button {
      position: absolute;
      top: 20px;
      padding: 8px 14px;
      border: 0;
      border-radius: 4px;
      background: #8c7b70;
      color: white;
      text-decoration: none;
      font: .85em sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }

    .cart-link { left: 20px; }
    .admin-link { right: 20px; }
    .refresh-button { right: 105px; }

    .cart-link:hover,
    .admin-link:hover,
    .refresh-button:hover,
    .shop-button:hover {
      background: #736359;
    }

    .main-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    .main-nav a {
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 20px;
      background: rgba(255,255,255,.2);
      color: white;
      text-decoration: none;
      font: .9em sans-serif;
      backdrop-filter: blur(5px);
    }

    .main-nav a:hover,
    .main-nav a.active {
      background: rgba(255,255,255,.4);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      min-height: 250px;
    }

    .section h2 {
      text-align: center;
      font: 2.5em Marseille, Georgia, serif;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .product-card {
      width: 250px;
      padding: 20px;
      background: white;
      border: 1px solid #e8e1da;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.04);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 5px;
    }

    .product-detail-link {
      color: #4a4543;
      text-decoration: none;
    }

    .product-detail-link:hover h3 {
      text-decoration: underline;
    }

    .product-card h3 { margin-bottom: 8px; }
    .product-price { font-weight: bold; }

    .shop-button {
      padding: 12px 22px;
      border: 0;
      border-radius: 4px;
      background: #8c7b70;
      color: white;
      cursor: pointer;
      font: .95em sans-serif;
    }

    footer {
      margin-top: 50px;
      padding: 30px;
      border-top: 1px solid #e8e1da;
      background: #f4efe9;
      color: #7a706b;
      text-align: center;
      font-size: .9em;
    }

    @media(max-width: 550px) {
      header { padding-top: 125px; }
      .refresh-button { top: 62px; right: 20px; }
      .product-card { width: 100%; max-width: 300px; }
    }
  </style>
</head>

<body>
  <header>
    <a href="#winkelmand" class="cart-link" data-open-cart>
      Winkelmand (<span data-cart-count>0</span>)
    </a>

    <button type="button" id="refresh-products-btn" class="refresh-button">
      🔄 Ververs
    </button>

    <a href="admin/" class="admin-link">Beheer</a>

    <h1>Onze Producten</h1>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="producten.html" class="active">Producten</a>
      <a href="over-ons.html">Over ons</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h2>Handgemaakte Kaarsen</h2>

      <div id="product-list" class="products" aria-live="polite">
        <p data-status="loading">Producten worden geladen...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Licht & Liefde - Handgemaakt met zorg.</p>
  </footer>

  <script src="taal.js"></script>
  <script src="winkelmand.js"></script>

  <script>
    let loadedProducts = [];
    let status = 'loading';
    let loading = false;

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.replaceChildren();

      if (status !== 'ready') {
        const message = Shop.element(
          'p',
          '',
          window.siteLanguage.text(status)
        );

        message.dataset.status = status;
        container.append(message);
        return;
      }

      for (const product of loadedProducts) {
        const card = Shop.element('article', 'product-card');
        const link = Shop.element('a', 'product-detail-link');

        link.href =
          `product.html?product=${encodeURIComponent(product.id)}`;

        const imageUrl = Shop.imageUrl(product.image);

        if (imageUrl) {
          const image = Shop.element('img');
          image.src = imageUrl;
          image.alt = Shop.title(product);
          image.loading = 'lazy';
          link.append(image);
        }

        link.append(Shop.element('h3', '', Shop.title(product)));

        const description = Shop.element(
          'p',
          '',
          Shop.description(product)
        );

        const price = Shop.element(
          'p',
          'product-price',
          Shop.money(product.cents)
        );

        const button = Shop.element(
          'button',
          'shop-button',
          window.siteLanguage.text('add')
        );

        button.type = 'button';

        button.addEventListener('click', () => {
          Shop.add(product, button);
        });

        card.append(link, description, price, button);
        container.append(card);
      }
    }

    async function loadProducts() {
      if (loading) return;

      loading = true;
      status = 'loading';
      renderProducts();

      const refresh = document.getElementById('refresh-products-btn');
      refresh.disabled = true;

      try {
        loadedProducts = await Shop.listProducts();
        status = loadedProducts.length ? 'ready' : 'empty';
      } catch (error) {
        status = 'error';
        console.error('Producten laden mislukt:', error);
      } finally {
        loading = false;
        refresh.disabled = false;
        renderProducts();
      }
    }

    document.getElementById('refresh-products-btn')
      .addEventListener('click', loadProducts);

    window.addEventListener('site-language-change', renderProducts);

    loadProducts();
  </script>
</body>
</html>
