<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Payment - Diatheke Atelier</title>
  <link rel="stylesheet" href="stijl.css">

  <style>
    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <header class="page-banner">
    <h1 id="heading">Checking payment</h1>
  </header>

  <main class="container payment-container">
    <section class="box">
      <p id="status" role="status" aria-live="polite"></p>
      <p id="order-number" class="note"></p>

      <button
        id="check"
        type="button"
        class="shop-button"
      ></button>

      <a id="resume" class="button" hidden></a>

      <p>
        <a href="producten.html" id="back"></a>
      </p>

      <p class="note" id="test-note" hidden></p>
    </section>
  </main>

  <footer>
    <p>© 2026 Diatheke Atelier — Made with care.</p>
  </footer>

  <script src="site-ui.js"></script>
  <script src="taal.js"></script>
  <script src="winkelmand.js"></script>

  <script>
    const ATTEMPT_KEY = 'licht-en-liefde-checkout-v1';

    const params = new URLSearchParams(location.search);
    const orderId = params.get('order');
    const key = params.get('key');

    const valid =
      /^[a-f0-9-]{36}$/.test(orderId || '') &&
      /^[a-f0-9]{64}$/.test(key || '');

    const button = document.getElementById('check');
    const resume = document.getElementById('resume');

    let data = null;
    let busy = false;
    let failed = false;
    let cartFailed = false;
    let polls = 0;
    let timer = null;

    function render() {
      const paid = data?.status === 'paid';
      const test = data?.mode === 'test';

      document.title = Shop.text(
        'Betaling - Diatheke Atelier',
        'Payment - Diatheke Atelier'
      );

      document.getElementById('heading').textContent = paid
        ? (
            test
              ? Shop.text(
                  'Testbetaling geslaagd',
                  'Test payment successful'
                )
              : Shop.text(
                  'Betaling geslaagd',
                  'Payment successful'
                )
          )
        : Shop.text(
            'Betaling controleren',
            'Checking payment'
          );

      document.getElementById('back').textContent =
        Shop.text(
          '← Terug naar shop',
          '← Back to shop'
        );

      const note = document.getElementById('test-note');

      note.hidden = !test;

      note.textContent = test
        ? Shop.text(
            'Dit is een testbetaling. Er is geen echt geld afgeschreven. De voorraad wordt wel bijgewerkt.',
            'This is a test payment. No real money has been charged. Stock is updated.'
          )
        : '';

      document.getElementById('order-number').textContent =
        valid
          ? `${Shop.text('Bestelnummer', 'Order number')}: ${orderId}`
          : '';

      button.textContent = busy
        ? Shop.text('Even controleren...', 'Checking...')
        : Shop.text('Opnieuw controleren', 'Check again');

      button.disabled = busy || !valid;
      button.hidden = paid && !cartFailed;
      resume.hidden = true;

      let message;

      if (!valid) {
        message = Shop.text(
          'Deze bestellink is ongeldig.',
          'This order link is invalid.'
        );
      } else if (failed) {
        message = Shop.text(
          'De betaling kon nog niet worden gecontroleerd. Klik op opnieuw controleren; begin geen nieuwe betaling.',
          'The payment could not be checked. Check again before starting another payment.'
        );
      } else if (paid) {
        message = test
          ? Shop.text(
              'Je testbetaling is geslaagd en de voorraad is bijgewerkt.',
              'Your test payment succeeded and stock has been updated.'
            )
          : Shop.text(
              'Bedankt voor je bestelling! Je betaling is geslaagd.',
              'Thank you for your order! Your payment was successful.'
            );
      } else if (
        ['canceled', 'expired', 'failed'].includes(data?.status)
      ) {
        message = Shop.text(
          'Deze betaling is geannuleerd, verlopen of mislukt. De gereserveerde voorraad is vrijgegeven.',
          'This payment was canceled, expired or failed. Reserved stock has been released.'
        );
      } else if (data?.status === 'review') {
        message = Shop.text(
          'Deze bestelling moet worden gecontroleerd. Begin hiervoor geen nieuwe betaling.',
          'This order needs to be checked. Do not start another payment for it.'
        );
      } else {
        message = Shop.text(
          'Er is nog geen geslaagde betaling bevestigd. We controleren de status opnieuw.',
          'A successful payment has not yet been confirmed. We will check the status again.'
        );
      }

      if (cartFailed) {
        message += '\n' + Shop.text(
          'Je winkelmand kon nog niet worden bijgewerkt. Klik op opnieuw controleren.',
          'Your cart could not be updated. Click check again.'
        );
      }

      document.getElementById('status').textContent = message;

      if (
        data?.status === 'pending' &&
        data.checkout_url
      ) {
        try {
          const url = new URL(data.checkout_url);

          if (
            url.protocol === 'https:' &&
            (
              url.hostname === 'mollie.com' ||
              url.hostname.endsWith('.mollie.com')
            )
          ) {
            resume.href = url.href;

            resume.textContent = Shop.text(
              'Terug naar deze betaling',
              'Return to this payment'
            );

            resume.hidden = false;
          }
        } catch (_) {}
      }
    }

    async function updateCart() {
      let attempt;

      try {
        attempt = JSON.parse(
          sessionStorage.getItem(ATTEMPT_KEY) || 'null'
        );
      } catch (_) {
        return;
      }

      if (
        !attempt ||
        attempt.checkout_key !== key ||
        !Array.isArray(attempt.items)
      ) {
        return;
      }

      if (
        attempt.order_id &&
        attempt.order_id !== orderId
      ) {
        return;
      }

      if (data.status === 'paid') {
        await Shop.completeOrder(orderId, attempt.items);
      }

      if (
        ['paid', 'canceled', 'expired', 'failed'].includes(data.status)
      ) {
        sessionStorage.removeItem(ATTEMPT_KEY);
      }
    }

    async function check() {
      if (busy || !valid) return;

      clearTimeout(timer);

      busy = true;
      failed = false;
      cartFailed = false;

      render();

      try {
        const response = await fetch(
          Shop.API +
          '/order?order=' +
          encodeURIComponent(orderId) +
          '&key=' +
          key,
          {
            cache: 'no-store',
            signal: AbortSignal.timeout(20000)
          }
        );

        const result = await response.json();

        if (
          !response.ok ||
          result.order_id !== orderId ||
          !['test', 'live'].includes(result.mode)
        ) {
          throw new Error('Controle mislukt');
        }

        data = result;

        try {
          await updateCart();
        } catch (_) {
          cartFailed = true;
        }

        if (
          ['pending', 'creating'].includes(data.status) &&
          polls < 8
        ) {
          polls++;
          timer = setTimeout(check, 5000);
        }
      } catch (_) {
        failed = true;
      } finally {
        busy = false;
        render();
      }
    }

    button.addEventListener('click', () => {
      polls = 0;
      check();
    });

    window.addEventListener(
      'site-language-change',
      render
    );

    window.addEventListener('pagehide', () => {
      clearTimeout(timer);
    });

    render();
    check();
  </script>
</body>
</html>
